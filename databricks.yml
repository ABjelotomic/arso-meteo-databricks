bundle:
  name: arso-bundle

variables:
  catalog:
    description: ARSO meteo catalog
    default: weather

resources:
  jobs:
    env_check_job:
      name: env_check_job
      tasks:
        - task_key: env_check
          notebook_task:
            notebook_path: ./src/env_check.py
            base_parameters:
              catalog: ${var.catalog}

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-e94f3514-2693.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-e94f3514-2693.cloud.databricks.com
      root_path: /Workspace/Users/anjinimejl@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: weather_prod
      
